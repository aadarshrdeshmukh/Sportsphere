<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hPrimaryBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E8A63"/>
      <stop offset="50%" stop-color="#0B6E4F"/>
      <stop offset="100%" stop-color="#064230"/>
    </linearGradient>

    <!-- Energy Ribbon Gradient -->
    <linearGradient id="hEnergyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA07A"/>
      <stop offset="50%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#E85015"/>
    </linearGradient>
  </defs>

  <!-- Logo Icon Container (64x64 at x=8, y=8) -->
  <g transform="translate(8, 8)">
    <rect width="64" height="64" rx="16" fill="url(#hPrimaryBgGrad)"/>
    <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1"/>
    
    <!-- Sphere Structure -->
    <circle cx="32" cy="32" r="18" stroke="#FFFFFF" stroke-width="1.8" stroke-opacity="0.9" fill="#09543C" fill-opacity="0.4"/>
    <ellipse cx="32" cy="32" rx="9" ry="18" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.4"/>
    <ellipse cx="32" cy="32" rx="18" ry="7" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.4"/>
    
    <!-- Dynamic Orbit Sweep -->
    <path d="M14 42 C18 24, 42 16, 52 24 C56 28, 52 34, 46 38 C38 43, 22 43, 14 42" 
          stroke="url(#hEnergyGrad)" 
          stroke-width="3" 
          stroke-linecap="round"/>

    <!-- Live indicator -->
    <circle cx="50" cy="24" r="2.5" fill="#D32F2F"/>
    <circle cx="50" cy="24" r="3.5" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- Brand Typography -->
  <text x="86" y="44" font-family="Inter, -apple-system, sans-serif" font-size="26" font-weight="900" letter-spacing="-0.5" fill="#1B1B1B">SPORT<tspan fill="#0B6E4F">SPHERE</tspan></text>
  <text x="87" y="60" font-family="Inter, -apple-system, sans-serif" font-size="10.5" font-weight="700" letter-spacing="2" fill="#707973">LIVE SPORTS &amp; NEWS</text>
  
  <!-- Live Tag Pill -->
  <rect x="272" y="30" width="46" height="18" rx="4" fill="#FFEAEA"/>
  <circle cx="282" cy="39" r="3" fill="#D32F2F"/>
  <text x="290" y="42.5" font-family="Inter, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#D32F2F" letter-spacing="0.5">LIVE</text>
</svg>
